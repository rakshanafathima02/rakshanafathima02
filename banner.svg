<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1280 560"
     role="img"
     aria-label="Rakshana Fathima - AI and Full-Stack Developer">

  <defs>

    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07070D"/>
      <stop offset="50%" stop-color="#151020"/>
      <stop offset="100%" stop-color="#08080E"/>
    </linearGradient>

    <!-- Animated heading gradient -->
    <linearGradient id="titleGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF4FD8">
        <animate
          attributeName="stop-color"
          values="#FF4FD8;#9B5CFF;#4DD8FF;#FF4FD8"
          dur="6s"
          repeatCount="indefinite"/>
      </stop>

      <stop offset="100%" stop-color="#4DD8FF">
        <animate
          attributeName="stop-color"
          values="#4DD8FF;#FF4FD8;#9B5CFF;#4DD8FF"
          dur="6s"
          repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Soft glow -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Small glow -->
    <filter id="smallGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="rounded">
      <rect width="1280" height="560" rx="32"/>
    </clipPath>

  </defs>


  <!-- ====================================================== -->
  <!-- BACKGROUND -->
  <!-- ====================================================== -->

  <rect
    width="1280"
    height="560"
    rx="32"
    fill="url(#bg)"/>


  <g clip-path="url(#rounded)">

    <!-- Ambient circles -->

    <circle
      cx="1060"
      cy="90"
      r="180"
      fill="#9B5CFF"
      opacity="0.10">
      <animate
        attributeName="opacity"
        values="0.06;0.14;0.06"
        dur="5s"
        repeatCount="indefinite"/>
    </circle>

    <circle
      cx="190"
      cy="470"
      r="230"
      fill="#FF4FD8"
      opacity="0.07">
      <animate
        attributeName="opacity"
        values="0.04;0.10;0.04"
        dur="6s"
        repeatCount="indefinite"/>
    </circle>

    <circle
      cx="650"
      cy="270"
      r="140"
      fill="#4DD8FF"
      opacity="0.04">
      <animate
        attributeName="r"
        values="120;155;120"
        dur="5s"
        repeatCount="indefinite"/>
    </circle>


    <!-- ================================================== -->
    <!-- TOP TERMINAL -->
    <!-- ================================================== -->

    <text
      x="70"
      y="70"
      font-family="monospace"
      font-size="24"
      fill="#BDB6CC">

      user@rakshana:~$

      <tspan fill="#FF79DF"> cat </tspan>

      <tspan fill="#DAD5E4">README.md</tspan>

      <tspan fill="#FFFFFF">_</tspan>

      <animate
        attributeName="opacity"
        values="0;1;1;1"
        dur="1.5s"
        repeatCount="indefinite"/>

    </text>


    <!-- ================================================== -->
    <!-- MAIN TITLE -->
    <!-- ================================================== -->

    <text
      x="70"
      y="175"
      font-family="Arial, Helvetica, sans-serif"
      font-size="76"
      font-weight="800"
      fill="url(#titleGradient)"
      filter="url(#glow)">

      Rakshana Fathima

      <animate
        attributeName="opacity"
        values="0;1"
        dur="1.2s"
        fill="freeze"/>

    </text>


    <!-- ================================================== -->
    <!-- ROLE -->
    <!-- ================================================== -->

    <text
      x="74"
      y="225"
      font-family="monospace"
      font-size="30"
      font-weight="600"
      fill="#F4F0FA">

      AI &amp; Full-Stack Developer

    </text>


    <!-- ================================================== -->
    <!-- TAGLINE -->
    <!-- ================================================== -->

    <text
      x="74"
      y="272"
      font-family="monospace"
      font-size="21"
      fill="#C7C0D4">

      Building AI-powered solutions and exploring emerging technologies.

    </text>


    <!-- ================================================== -->
    <!-- SKILL PILLS -->
    <!-- ================================================== -->

    <!-- Python -->

    <rect
      x="74"
      y="315"
      width="112"
      height="42"
      rx="21"
      fill="#FFFFFF08"
      stroke="#FF4FD8"
      stroke-width="1.5"/>

    <text
      x="98"
      y="342"
      font-family="monospace"
      font-size="17"
      fill="#FF9CE8">

      Python

    </text>


    <!-- JavaScript -->

    <rect
      x="198"
      y="315"
      width="142"
      height="42"
      rx="21"
      fill="#FFFFFF08"
      stroke="#9B5CFF"
      stroke-width="1.5"/>

    <text
      x="224"
      y="342"
      font-family="monospace"
      font-size="17"
      fill="#CDB8FF">

      JavaScript

    </text>


    <!-- SQL -->

    <rect
      x="352"
      y="315"
      width="95"
      height="42"
      rx="21"
      fill="#FFFFFF08"
      stroke="#4DD8FF"
      stroke-width="1.5"/>

    <text
      x="380"
      y="342"
      font-family="monospace"
      font-size="17"
      fill="#8CEBFF">

      SQL

    </text>


    <!-- Generative AI -->

    <rect
      x="459"
      y="315"
      width="145"
      height="42"
      rx="21"
      fill="#FFFFFF08"
      stroke="#FF4FD8"
      stroke-width="1.5"/>

    <text
      x="481"
      y="342"
      font-family="monospace"
      font-size="17"
      fill="#FF9CE8">

      Generative AI

    </text>


    <!-- ================================================== -->
    <!-- PROFILE.JS CARD -->
    <!-- ================================================== -->

    <g transform="translate(850 135)">

      <rect
        x="0"
        y="0"
        width="300"
        height="250"
        rx="24"
        fill="#0C0B13"
        stroke="#3B3349"
        stroke-width="1.5"/>


      <!-- Card header -->

      <text
        x="28"
        y="38"
        font-family="monospace"
        font-size="18"
        fill="#FF79DF">

        profile.js

      </text>


      <!-- const -->

      <text
        x="28"
        y="78"
        font-family="monospace"
        font-size="18"
        fill="#5FDBFF">

        const

      </text>


      <text
        x="92"
        y="78"
        font-family="monospace"
        font-size="18"
        fill="#FFFFFF">

        developer = {

      </text>


      <!-- focus -->

      <text
        x="44"
        y="112"
        font-family="monospace"
        font-size="17"
        fill="#C2A8FF">

        focus:

      </text>

      <text
        x="120"
        y="112"
        font-family="monospace"
        font-size="17"
        fill="#FFFFFF">

        "AI"

      </text>


      <!-- stack -->

      <text
        x="44"
        y="146"
        font-family="monospace"
        font-size="17"
        fill="#C2A8FF">

        stack:

      </text>

      <text
        x="120"
        y="146"
        font-family="monospace"
        font-size="17"
        fill="#FFFFFF">

        "Full-Stack"

      </text>


      <!-- problems -->

      <text
        x="44"
        y="180"
        font-family="monospace"
        font-size="17"
        fill="#C2A8FF">

        problems:

      </text>

      <text
        x="150"
        y="180"
        font-family="monospace"
        font-size="17"
        fill="#FFFFFF">

        "90+"

      </text>


      <text
        x="28"
        y="218"
        font-family="monospace"
        font-size="18"
        fill="#FFFFFF">

        };

      </text>

    </g>


    <!-- ================================================== -->
    <!-- FLOATING PARTICLES -->
    <!-- ================================================== -->

    <circle
      cx="760"
      cy="90"
      r="2.5"
      fill="#FFFFFF"
      filter="url(#smallGlow)">

      <animate
        attributeName="opacity"
        values="0.15;1;0.15"
        dur="2s"
        repeatCount="indefinite"/>

    </circle>


    <circle
      cx="1180"
      cy="420"
      r="2.5"
      fill="#FFFFFF"
      filter="url(#smallGlow)">

      <animate
        attributeName="opacity"
        values="0.1;1;0.1"
        dur="1.7s"
        repeatCount="indefinite"/>

    </circle>


    <circle
      cx="690"
      cy="430"
      r="2.5"
      fill="#FFFFFF"
      filter="url(#smallGlow)">

      <animate
        attributeName="opacity"
        values="0.1;1;0.1"
        dur="2.4s"
        repeatCount="indefinite"/>

    </circle>


    <!-- ================================================== -->
    <!-- PINK SCANNING LINE -->
    <!-- ================================================== -->

    <!-- Kept behind the important visual area and made subtle -->

    <rect
      x="-100"
      y="90"
      width="1480"
      height="3"
      rx="2"
      fill="#FF4FD8"
      opacity="0.28"
      filter="url(#glow)">

      <animate
        attributeName="y"
        values="80;500;80"
        dur="5s"
        repeatCount="indefinite"/>

    </rect>


    <!-- ================================================== -->
    <!-- BOTTOM LINE -->
    <!-- ================================================== -->

    <rect
      x="70"
      y="410"
      width="1080"
      height="1"
      fill="#FFFFFF"
      opacity="0.10"/>


    <!-- ================================================== -->
    <!-- FOOTER -->
    <!-- ================================================== -->

    <text
      x="70"
      y="455"
      font-family="monospace"
      font-size="18"
      fill="#AAA2B8">

      Artificial Intelligence • Full-Stack Development • Problem Solving

    </text>


    <text
      x="70"
      y="495"
      font-family="monospace"
      font-size="16"
      fill="#766E82">

      github.com/rakshanafathima02

    </text>


    <!-- Animated small terminal cursor -->

    <rect
      x="410"
      y="481"
      width="9"
      height="18"
      fill="#FF4FD8">

      <animate
        attributeName="opacity"
        values="1;0;1"
        dur="1s"
        repeatCount="indefinite"/>

    </rect>

  </g>

</svg>
