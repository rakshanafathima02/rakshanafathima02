<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" role="img" aria-label="Rakshana Fathima - AI and Full-Stack Developer">
<defs>
  <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0" stop-color="#f7f5fb"/><stop offset=".5" stop-color="#ffffff"/><stop offset="1" stop-color="#f2eff9"/>
  </linearGradient>
  <linearGradient id="neon" x1="0" x2="1">
    <stop stop-color="#ff4fd8"><animate attributeName="stop-color" values="#ff4fd8;#9b5cff;#4dd8ff;#ff4fd8" dur="6s" repeatCount="indefinite"/></stop>
    <stop offset="1" stop-color="#4dd8ff"><animate attributeName="stop-color" values="#4dd8ff;#ff4fd8;#9b5cff;#4dd8ff" dur="6s" repeatCount="indefinite"/></stop>
  </linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="round"><rect width="1280" height="560" rx="32"/></clipPath>
</defs>

<rect width="1280" height="560" rx="32" fill="url(#bg)"/>
<g clip-path="url(#round)">
  <circle cx="1050" cy="90" r="170" fill="#9b5cff" opacity=".10"/>
  <circle cx="210" cy="470" r="230" fill="#ff4fd8" opacity=".07"/>
  <circle cx="660" cy="270" r="130" fill="#4dd8ff" opacity=".04"/>

  <g font-family="monospace" fill="#b6b0c9" font-size="24">
    <text x="70" y="70">user@rakshana:~$ <tspan fill="#ff79df">cat</tspan> README.md<tspan fill="#fff">_</tspan>
      <animate attributeName="opacity" values="0;1;1;1" dur="1.8s" repeatCount="indefinite"/>
    </text>
  </g>

  <text x="70" y="175" font-family="Arial, sans-serif" font-size="76" font-weight="800" fill="url(#neon)" filter="url(#glow)">
    Rakshana Fathima
    <animate attributeName="opacity" values="0;1" dur="1.4s" fill="freeze"/>
  </text>

  <text x="74" y="225" font-family="monospace" font-size="30" fill="#292333">
    AI &amp; Full-Stack Developer
  </text>

  <text x="74" y="272" font-family="monospace" font-size="21" fill="#5b5368">
    Building AI-powered solutions and exploring emerging technologies.
  </text>

  <g font-family="monospace" font-size="18">
    <rect x="74" y="315" width="112" height="42" rx="21" fill="#ffffff10" stroke="#ff4fd8"/>
    <text x="98" y="342" fill="#ffd7f6">Python</text>
    <rect x="198" y="315" width="142" height="42" rx="21" fill="#ffffff10" stroke="#9b5cff"/>
    <text x="224" y="342" fill="#e4d5ff">JavaScript</text>
    <rect x="352" y="315" width="95" height="42" rx="21" fill="#ffffff10" stroke="#4dd8ff"/>
    <text x="380" y="342" fill="#c9f7ff">SQL</text>
    <rect x="459" y="315" width="120" height="42" rx="21" fill="#ffffff10" stroke="#ff4fd8"/>
    <text x="481" y="342" fill="#ffd7f6">Generative AI</text>
  </g>

  <g transform="translate(850 135)">
    <rect x="0" y="0" width="300" height="250" rx="24" fill="#ffffff" stroke="#ffffff20"/>
    <text x="28" y="38" fill="#ff79df" font-family="monospace" font-size="18">profile.js</text>
    <text x="28" y="78" fill="#7ee7ff" font-family="monospace" font-size="18">const</text>
    <text x="92" y="78" fill="#fff" font-family="monospace" font-size="18">developer = &#123;</text>
    <text x="44" y="112" fill="#bfa9ff" font-family="monospace" font-size="17">focus:</text>
    <text x="120" y="112" fill="#fff" font-family="monospace" font-size="17">"AI"</text>
    <text x="44" y="146" fill="#bfa9ff" font-family="monospace" font-size="17">stack:</text>
    <text x="120" y="146" fill="#fff" font-family="monospace" font-size="17">"Full-Stack"</text>
    <text x="44" y="180" fill="#bfa9ff" font-family="monospace" font-size="17">problems:</text>
    <text x="150" y="180" fill="#fff" font-family="monospace" font-size="17">"90+"</text>
    <text x="28" y="218" fill="#fff" font-family="monospace" font-size="18">&#125;;</text>
  </g>

  <rect x="-100" y="505" width="1480" height="3" fill="#ff4fd8" opacity=".75" filter="url(#glow)">
    <animate attributeName="y" values="80;505;80" dur="4.5s" repeatCount="indefinite"/>
  </rect>

  <g fill="#fff">
    <circle cx="760" cy="90" r="2"><animate attributeName="opacity" values=".1;1;.1" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="1180" cy="420" r="2"><animate attributeName="opacity" values=".1;1;.1" dur="1.7s" repeatCount="indefinite"/></circle>
    <circle cx="690" cy="430" r="2"><animate attributeName="opacity" values=".1;1;.1" dur="2.4s" repeatCount="indefinite"/></circle>
  </g>
</g>
</svg>
